# darknet's own cfg/cifar.cfg, retargeted at this benchmark's data layout
# (learning_rate 0.02, max_batches 5000). Nine convolutions at 128/256/512
# filters, about 1.6 BFLOPs of forward work per image.
#
# This is a GPU config. Measured on a laptop CPU it runs at roughly 4 images a
# second, which puts a full 5000-batch schedule at about 45 hours, so the CPU
# benchmark uses the smaller cifar10.cfg instead and this one is here for GPU
# runs and for comparison against upstream's published CIFAR numbers:
#
#   ./bench/benchmark.sh --platforms gpu --datasets cifar10-full
[net]
batch=128
subdivisions=1
height=28
width=28
channels=3
max_crop=32
min_crop=32

hue=.1
saturation=.75
exposure=.75

learning_rate=0.02
policy=poly
power=4
max_batches=5000
momentum=0.9
decay=0.0005


[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[dropout]
probability=.5

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[dropout]
probability=.5

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[dropout]
probability=.5

[convolutional]
filters=10
size=1
stride=1
pad=1
activation=leaky

[avgpool]

[softmax]
groups=1
