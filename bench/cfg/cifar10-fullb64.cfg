# darknet's own cfg/cifar.cfg (nine convolutions at 128/256/512 filters, about
# 1.6 BFLOPs of forward work per image), at batch 64 instead of 128.
#
# These variants were written for the batch-size sweep in bench/REPORT.md, to
# test whether the RX 6650 XT's 2.2x deficit to an RTX 3060 Ti came from
# overrunning its 32 MB Infinity Cache -- at batch 128 a single hidden
# activation of this network is 128x128x28x28x4 B = 51 MB. If so, the gap
# should have narrowed at batch sizes whose working set still fits.
#
# It did not. The ratio held at 2.26-2.28x from batch 16 to 128, and absolute
# throughput barely moved either, because batch size only scales the number of
# thread blocks rather than the efficiency of any one of them. The hypothesis
# is refuted; the configs are kept because the sweep is worth repeating after
# any change to the GEMM.
#
#   ./bench/benchmark.sh --platforms gpu --datasets cifar10-fullb64 \
#       --train-batches 200 --tag <machine>_sweep --append
#
# Accuracy from these runs is meaningless; they measure throughput only.
[net]
batch=64
subdivisions=1
height=28
width=28
channels=3
max_crop=32
min_crop=32

hue=.1
saturation=.75
exposure=.75

learning_rate=0.02
policy=poly
power=4
max_batches=5000
momentum=0.9
decay=0.0005


[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[dropout]
probability=.5

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[dropout]
probability=.5

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[dropout]
probability=.5

[convolutional]
filters=10
size=1
stride=1
pad=1
activation=leaky

[avgpool]

[softmax]
groups=1
