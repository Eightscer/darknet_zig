# darknet's own cfg/cifar.cfg (nine convolutions at 128/256/512 filters, about
# 1.6 BFLOPs of forward work per image), at batch 64 instead of 128.
#
# These variants exist for the batch-size sweep described in bench/REPORT.md.
# The RX 6650 XT has 32 MB of Infinity Cache, but at batch 128 a single hidden
# activation of this network is 128x128x28x28x4 B = 51 MB, so it spills to a
# 128-bit memory bus. If that is what costs AMD its 2.2x gap to the RTX 3060
# Ti, the gap should narrow at batch sizes whose working set still fits.
#
#   ./bench/benchmark.sh --platforms gpu --datasets cifar10-fullb64 \
#       --train-batches 200 --tag <machine>_sweep --append
#
# Accuracy from these runs is meaningless; they measure throughput only.
[net]
batch=64
subdivisions=1
height=28
width=28
channels=3
max_crop=32
min_crop=32

hue=.1
saturation=.75
exposure=.75

learning_rate=0.02
policy=poly
power=4
max_batches=5000
momentum=0.9
decay=0.0005


[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[dropout]
probability=.5

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=256
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[dropout]
probability=.5

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=512
size=3
stride=1
pad=1
activation=leaky

[dropout]
probability=.5

[convolutional]
filters=10
size=1
stride=1
pad=1
activation=leaky

[avgpool]

[softmax]
groups=1
