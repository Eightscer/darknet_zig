# CIFAR-10, sized so that a CPU can finish a full schedule.
#
# Same [net] section as darknet's cifar.cfg -- identical crops, augmentation
# and optimiser -- but five convolutions instead of nine and a quarter of the
# width, which is about 0.03 BFLOPs of forward work per image against 1.6.
# The heavy original is kept as cifar10-full.cfg for GPU runs.
#
# Horizontal flips stay on here, unlike mnist.cfg: a mirrored cat is a cat.
[net]
batch=128
subdivisions=1
height=28
width=28
channels=3
max_crop=32
min_crop=32

hue=.1
saturation=.75
exposure=.75

learning_rate=0.02
policy=poly
power=4
max_batches=1000
momentum=0.9
decay=0.0005

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=128
size=3
stride=1
pad=1
activation=leaky

[connected]
output=128
activation=leaky

[dropout]
probability=.5

[connected]
output=10
activation=linear

[softmax]
groups=1
