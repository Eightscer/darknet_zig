# MNIST, 28x28. Deliberately small: the point of the benchmark is to measure
# the platform, and a net that takes an hour to train tells you less per minute
# of wall clock than one that takes a few.
[net]
batch=128
subdivisions=1
height=28
width=28
channels=3
max_crop=28
min_crop=28

# MNIST digits are not colour- or orientation-invariant, so the augmentation
# that helps on natural images hurts here. Only a little jitter.
hue=0
saturation=1
exposure=1
angle=5
# A mirrored 2 is not a 2.
flip=0
aspect=1

learning_rate=0.01
policy=poly
power=4
max_batches=1000
momentum=0.9
decay=0.0005

[convolutional]
batch_normalize=1
filters=16
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=32
size=3
stride=1
pad=1
activation=leaky

[maxpool]
size=2
stride=2

[convolutional]
batch_normalize=1
filters=64
size=3
stride=1
pad=1
activation=leaky

# A fully-connected head rather than the 1x1-conv + global average pool
# that darknet's cifar.cfg uses. Average pooling discards where in the
# frame the evidence was, which is most of what separates a 6 from a 9,
# and this trunk is too narrow to compensate: measured at 500 batches,
# the pooled head reaches 51% top-1 and this one 95%.
[connected]
output=128
activation=leaky

[dropout]
probability=.5

[connected]
output=10
activation=linear

[softmax]
groups=1
