# tiny.cfg's exact topology (16 convolutional layers, 4 maxpools, global
# average pool, softmax), retargeted at the circle-vs-square example so it can
# be trained on a laptop CPU.
#
# The layer stack, activations, batch norm and augmentation are untouched.
# Seven values differ from darknet's cfg/tiny.cfg:
#
#   width/height   224 -> 64    (4 maxpools still leave a 4x4 map for the avgpool)
#   max_crop       320 -> 96    (the generated images are 96x96)
#   batch          128 -> 16    (fits comfortably in laptop RAM)
#   last filters  1000 -> 2     (two classes instead of ImageNet's 1000)
#
#   learning_rate  0.1 -> 0.01
#       0.1 is tuned for ImageNet over 1.6M batches; on this task it is hot
#       enough that the run never leaves chance accuracy.
#
#   max_batches  1.6M -> 800
#       800 is not about fitting the training set -- the loss is near zero by
#       batch 150. It is about batch norm. The inference-time statistics are
#       an exponential moving average with a 1% step (darknet's constant),
#       starting from zero, so after n batches they have covered only
#       1 - 0.99^n of the distance to the true values: 45% at n=60, 87% at
#       n=200, 99.9% at n=700. Every batch-normalised layer divides by an
#       under-estimated standard deviation, and with 15 of them stacked the
#       error compounds. Stop early and the training loss looks excellent
#       while prediction sits at chance. This is darknet's behaviour, not a
#       quirk of the port; see the "rolling statistics" test in
#       src/smoke_test.zig.

[net]
# Train
batch=16
subdivisions=1
# Test
# batch=1
# subdivisions=1
height=64
width=64
channels=3
momentum=0.9
decay=0.0005
max_crop=96

learning_rate=0.01
policy=poly
power=4
max_batches=800

angle=7
hue=.1
saturation=.75
exposure=.75
aspect=.75

[convolutional]
batch_normalize=1
filters=16
size=3
stride=1
pad=1
activation=leaky

[maxpool]
